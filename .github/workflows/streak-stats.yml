name: Update streak stats

on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 03:00 JST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=04050E&border=1E1B4B&stroke=312E81&ring=22D3EE&fire=C084FC&currStreakNum=E8ECFF&sideNums=C7D2FE&currStreakLabel=22D3EE&sideLabels=8FA3D4&dates=6B7AA8&excludeDaysLabel=6B7AA8
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: ストリークを更新" || exit 0
          git push
