name: Update streak stats

on:
  schedule:
    - cron: "20 18 * * *"   # 毎日 03:00 JST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=04050E&border=1E1B4B&stroke=312E81&ring=22D3EE&fire=C084FC&currStreakNum=E8ECFF&sideNums=C7D2FE&currStreakLabel=22D3EE&sideLabels=8FA3D4&dates=6B7AA8&excludeDaysLabel=6B7AA8&card_width=560
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: ストリークを更新"
          # 他のワークフローと同時に走ると push が競合するのでリトライする
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "push 成功（試行 $i 回目）"
              exit 0
            fi
            echo "競合。再試行します（$i/5）"
            sleep 7
          done
          echo "5 回試して push できませんでした"
          exit 1
